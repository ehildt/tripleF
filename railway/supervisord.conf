# All-in-one Railway stack: postgres first, keydb/minio next, the server
# once infra is up (its start script waits explicitly), nginx last.
#
# Paths under /usr/lib/postgresql and /var/lib/postgresql are globbed so
# this stays agnostic to the PostgreSQL major version apt installed.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:postgres]
priority=10
user=postgres
command=/bin/sh -c 'exec /usr/lib/postgresql/*/bin/postgres -D /var/lib/postgresql/*/main -c config_file=$(echo /etc/postgresql/*/main/postgresql.conf)'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:keydb]
priority=15
command=/usr/local/bin/keydb-server /etc/keydb/keydb.conf
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:minio]
priority=15
command=/usr/local/bin/minio server /data/minio --console-address ":9001"
environment=MINIO_ROOT_USER=minioadmin,MINIO_ROOT_PASSWORD=minioadmin
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:server]
priority=30
directory=/app/server
command=/bin/sh /app/railway/start-server.sh
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
priority=40
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
