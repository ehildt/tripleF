# SearXNG settings — based on official template at
# https://github.com/searxng/searxng/blob/master/utils/templates/etc/searxng/settings.yml

use_default_settings:
  engines:
    remove:
      - ahmia
      - torch
      - radio browser

engines:
  - name: brave
    rate_limit: 0.0
  - name: wikidata
    timeout: 15.0

general:
  debug: false
  instance_name: "SearXNG"

search:
  safe_search: 2
  autocomplete: duckduckgo
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "visions"
  limiter: false
  image_proxy: false
