# SearXNG uWSGI configuration
# Only active when SEARXNG_UWSGI=true (Docker container defaults to Granian)
# Based on upstream template:
# https://github.com/searxng/searxng/blob/master/utils/templates/etc/uwsgi/apps-available/searxng.ini

[uwsgi]

uid = searxng
gid = searxng

env = LANG=C.UTF-8
env = LANGUAGE=C.UTF-8
env = LC_ALL=C.UTF-8

chdir = /usr/local/searxng/searx

disable-logging = true

single-interpreter = true
master = true
lazy-apps = true

plugin = python3,http

enable-threads = true

workers = %k
threads = 4

module = searx.webapp

virtualenv = /usr/local/searxng/searx-pyenv
pythonpath = /usr/local/searxng/searxng-src

http = :8080
buffer-size = 8192

offload-threads = %k
