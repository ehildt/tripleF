<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 16 16"
  class="working-indicator__root"
  role="img"
  aria-label="working"
>
  <style>
    .working-indicator__root {
      width: 100%;
      height: 100%;
      display: block;
    }

    .working-indicator__shape {
      fill: color-mix(in srgb, var(--color-accent-primary) 12%, transparent);
      stroke: color-mix(in srgb, var(--color-accent-primary) 55%, transparent);
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .working-indicator__dots circle {
      fill: var(--color-accent-primary);
      animation: working-dot-pulse 1.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .working-indicator__dot:nth-of-type(2) { animation-delay: -0.2s; }
    .working-indicator__dot:nth-of-type(3) { animation-delay: -0.4s; }
    .working-indicator__dot:nth-of-type(4) { animation-delay: -0.6s; }
    .working-indicator__dot:nth-of-type(5) { animation-delay: -0.8s; }
    .working-indicator__dot:nth-of-type(6) { animation-delay: -1s; }
    .working-indicator__dot:nth-of-type(7) { animation-delay: -1.2s; }
    .working-indicator__dot:nth-of-type(8) { animation-delay: -1.4s; }
    .working-indicator__dot:nth-of-type(9) { animation-delay: -1.6s; }

    .working-indicator__static {
      display: none;
    }

    .working-indicator__static circle {
      fill: var(--color-fg-muted);
    }

    @keyframes working-dot-pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.35);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .working-indicator__shape,
      .working-indicator__dots {
        display: none;
      }

      .working-indicator__static {
        display: block;
      }
    }
  </style>

  <!-- Animated shape: triangle → square → octagon → circle → triangle. -->
  <polygon
    class="working-indicator__shape"
    points="8,3.5 6.5,6.5 5,9.5 3.5,12.5 6.5,12.5 9.5,12.5 12.5,12.5 10.25,8"
  >
    <animate
      attributeName="points"
      values="8,3.5 6.5,6.5 5,9.5 3.5,12.5 6.5,12.5 9.5,12.5 12.5,12.5 10.25,8;8,3.5 12.5,3.5 12.5,8 12.5,12.5 8,12.5 3.5,12.5 3.5,8 3.5,3.5;12.7,8 11.32,11.32 8,12.7 4.68,11.32 3.3,8 4.68,4.68 8,3.3 11.32,4.68;12.7,8 11.32,11.32 8,12.7 4.68,11.32 3.3,8 4.68,4.68 8,3.3 11.32,4.68;8,3.5 6.5,6.5 5,9.5 3.5,12.5 6.5,12.5 9.5,12.5 12.5,12.5 10.25,8"
      dur="8s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
    />
  </polygon>

  <g class="working-indicator__dots">
    <!-- Single center dot, shown only for the circle shape. -->
    <circle class="working-indicator__center" cx="8" cy="8" r="0.9" opacity="0">
      <animate
        attributeName="opacity"
        values="0;0;0;1;0"
        dur="8s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
      />
    </circle>
    <!-- Perimeter dots (count matches shape: 3 / 4 / 8 / 1). -->
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="8;8;12.7;12.7;8" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="3.5;3.5;8;8;3.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="1;0;1;0;1" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="6.5;12.5;11.32;11.32;6.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="6.5;3.5;11.32;11.32;6.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="0;1;1;0;0" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="5;12.5;8;8;5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="9.5;8;12.7;12.7;9.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="0;0;1;0;0" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="3.5;12.5;4.68;4.68;3.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="12.5;12.5;11.32;11.32;12.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="1;1;1;0;1" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="6.5;8;3.3;3.3;6.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="12.5;12.5;8;8;12.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="0;0;1;0;0" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="9.5;3.5;4.68;4.68;9.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="12.5;12.5;4.68;4.68;12.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="0;1;1;0;0" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="12.5;3.5;8;8;12.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="12.5;8;3.3;3.3;12.5" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="1;0;1;0;1" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
    <circle class="working-indicator__dot" cx="8" cy="3.5" r="0.9">
      <animate attributeName="cx" values="10.25;3.5;11.32;11.32;10.25" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="cy" values="8;3.5;4.68;4.68;8" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
      <animate attributeName="opacity" values="0;1;1;0;0" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" />
    </circle>
  </g>

  <!-- Static fallback shown under reduced motion. -->
  <g class="working-indicator__static">
    <polygon
      points="8,3.5 3.5,12.5 12.5,12.5"
      fill="none"
      stroke="var(--color-fg-muted)"
      stroke-width="1"
      stroke-linejoin="round"
    />
    <circle cx="8" cy="3.5" r="0.9" />
    <circle cx="3.5" cy="12.5" r="0.9" />
    <circle cx="12.5" cy="12.5" r="0.9" />
  </g>
</svg>
