# Local development stack. All services share one image (target: local)
# and one dependency state: the repository root is bind-mounted at /repo,
# so the workspace install performed once by the one-shot `deps` service
# is used identically by host tooling and both dev servers — no more
# conflicting node_modules/lockfile regimes.
services:
  deps:
    container_name: deps
    image: triplef-local
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    user: "1000:1000"
    working_dir: /repo
    entrypoint: ["pnpm", "install", "--frozen-lockfile", "--prefer-offline"]
    volumes:
      - ./:/repo
    networks:
      - triplef

  server:
    container_name: server
    image: triplef-local
    user: "1000:1000"
    restart: on-failure
    working_dir: /repo/apps/server
    entrypoint: ["pnpm", "start:dev"]
    depends_on:
      deps:
        condition: service_completed_successfully
      memory:
        condition: service_started
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      MEMORY_URL: http://memory:3400
    volumes:
      - ./:/repo
    env_file:
      - ./apps/server/.env
    ports:
      - "3000:3000"
    networks:
      - triplef
    extra_hosts:
      - "host.docker.internal:host-gateway"

  memory:
    container_name: memory
    image: triplef-local
    user: "1000:1000"
    restart: on-failure
    working_dir: /repo/apps/memory
    entrypoint: ["pnpm", "start:dev"]
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      PORT: 3400
    volumes:
      - ./:/repo
    env_file:
      - ./apps/memory/.env
    ports:
      - "3400:3400"
    networks:
      - triplef
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    container_name: dashboard
    image: triplef-local
    user: "1000:1000"
    restart: on-failure
    working_dir: /repo/apps/dashboard
    entrypoint: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      deps:
        condition: service_completed_successfully
      server:
        condition: service_started
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ./:/repo
    env_file:
      - ./apps/dashboard/.env
    ports:
      - "5173:5173"
    networks:
      - triplef

networks:
  triplef:
    external: true
    name: triplef
