# Local development stack. All services share one image (target: local)
# and one dependency state: the repository root is bind-mounted at /repo,
# so the workspace install performed once by the one-shot `deps` service
# is used identically by host tooling and both dev servers — no more
# conflicting node_modules/lockfile regimes.
services:
  deps:
    container_name: deps
    image: triplef-local
    build:
      context: .
      dockerfile: Dockerfile
      target: local
    user: "1000:1000"
    working_dir: /repo
    entrypoint: ["pnpm", "install", "--frozen-lockfile", "--prefer-offline"]
    volumes:
      - ./:/repo
    networks:
      - triplef.io

  server:
    container_name: server
    image: triplef-local
    user: "1000:1000"
    restart: on-failure
    working_dir: /repo/server
    entrypoint: ["pnpm", "start:dev"]
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - ./:/repo
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    networks:
      - triplef.io
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    container_name: dashboard
    image: triplef-local
    user: "1000:1000"
    restart: on-failure
    working_dir: /repo/dashboard
    entrypoint: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      deps:
        condition: service_completed_successfully
      server:
        condition: service_started
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ./:/repo
    env_file:
      - ./dashboard/.env
    ports:
      - "5173:5173"
    networks:
      - triplef.io

  # Headless-chromium MCP sidecar exposing browser automation tools to the
  # harness models. Internal-only: the server reaches it at
  # http://playwright-mcp:8931/mcp, no host port is published.
  playwright-mcp:
    container_name: playwright-mcp
    image: mcr.microsoft.com/playwright/mcp
    init: true
    restart: on-failure
    # Chromium wants a larger /dev/shm than Docker's default 64MB.
    shm_size: 2gb
    entrypoint: ["node", "/app/cli.js"]
    # allowed-hosts entries must match the Host header verbatim — port included.
    command: ["--headless", "--browser", "chromium", "--isolated", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "playwright-mcp:8931,localhost:8931,dashboard:5173,server:3000", "--caps", "testing"]
    # Loopback-only publish so host-side MCP clients (pi via pi-mcp-extension)
    # can reach the sidecar at http://localhost:8931/mcp. Not exposed to the LAN.
    ports:
      - "127.0.0.1:8931:8931"
    networks:
      - triplef.io

networks:
  triplef.io:
    external: true
    name: triplef.io
