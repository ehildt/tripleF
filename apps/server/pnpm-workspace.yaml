# Mirror the root workspace: do not run a workspace-wide `pnpm install`
# before every script — it churns the lockfile and the minimumReleaseAge
# exclude list on every publish.
verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  fastify-socket.io: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - '@triplef/helpers@1.5.1 || 1.5.2 || 1.5.4'
  - '@triplef/config-factory@1.1.3'
  - npm-check-updates@23.1.0
  - '@triplef/core-logger@0.0.0 || 0.0.2 || 0.1.0'
  - '@ai-sdk/gateway@4.0.64 || 4.0.67 || 4.0.68 || 4.0.70 || 4.0.71 || 4.0.72 || 4.0.73 || 4.0.75'
  - '@ai-sdk/mcp@2.0.37 || 2.0.39 || 2.0.40 || 2.0.42 || 2.0.43 || 2.0.45'
  - '@ai-sdk/provider-utils@5.0.30 || 5.0.32 || 5.0.33 || 5.0.35 || 5.0.36'
  - '@ai-sdk/provider@4.0.8 || 4.0.10'
  - '@nestjs/common@11.2.3'
  - '@nestjs/core@11.2.3'
  - '@nestjs/microservices@11.2.3'
  - '@nestjs/platform-fastify@11.2.3'
  - '@nestjs/testing@11.2.3'
  - '@prisma/config@7.10.0'
  - '@prisma/debug@7.10.0'
  - '@prisma/engines@7.10.0'
  - '@prisma/fetch-engine@7.10.0'
  - '@prisma/get-platform@7.10.0'
  - '@triplef/bullmq-logger@1.2.4'
  - '@triplef/bullmq@1.1.4'
  - '@types/node@26.3.0 || 26.4.0 || 26.4.1'
  - ai@7.0.79 || 7.0.83 || 7.0.84 || 7.0.86 || 7.0.87 || 7.0.88 || 7.0.89 || 7.0.90 || 7.0.91 || 7.0.93
  - bullmq@6.2.1 || 6.3.1 || 6.3.2 || 6.3.3 || 6.3.4
  - prisma@7.10.0
  - '@triplef/agent@0.1.2 || 0.1.6 || 0.1.7 || 0.1.9 || 0.1.11 || 0.1.12 || 0.1.13 || 0.1.15 || 0.1.17'
