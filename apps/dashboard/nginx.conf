server {
  listen 80;
  server_name _;

  # Compress static JS/CSS/JSON/SVG before it crosses the wire: the stock
  # nginx image only gzips text/html by default, which left the ~1 MB of
  # chat-route chunks uncompressed on the critical path (HTTP/1.1, no
  # per-origin multiplexing). gzip_static would need precompressed assets
  # at build time — out of scope; on-the-fly gzip is enough.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/css
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    font/woff2;

  # Allow image uploads up to the server's body limit. The server limit is
  # configured via BODY_LIMIT (100MB in this repo's env); without a matching
  # cap here nginx's default 1m would reject them.
  client_max_body_size 100m;

  # Proxy REST API to the backend. The server's global prefix is `api/v`,
  # so the request path is preserved verbatim.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy the memory app's REST surface. The dashboard rewrites /api →
  # /memory-api for memory calls; this location strips the /memory-api/
  # prefix and prepends the memory app's /api/ prefix.
  location /memory-api/ {
    proxy_pass http://memory:3400/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Socket.IO (chat streaming) to the backend, with WebSocket upgrade.
  location /socket.io/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Dashboard SPA + assets, served under the /dashboard/ base path. The built
  # `dist/` is copied to /usr/share/nginx/html (index.html + assets/), so the
  # `/dashboard/` URL prefix maps onto it via alias, with SPA fallback.
  location /dashboard/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /dashboard/index.html;
  }

  # Bare root → dashboard.
  location = / {
    return 301 /dashboard/;
  }
}
