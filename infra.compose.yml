services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: triplef
      POSTGRES_PASSWORD: triplef
      POSTGRES_DB: triplef
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - triplef.io

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: on-failure
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - triplef.io

  keydb:
    image: eqalpha/keydb
    container_name: keydb
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - keydb_data:/data
      - ./server/keydb.conf:/usr/local/etc/keydb/keydb.conf
    command: keydb-server /usr/local/etc/keydb/keydb.conf
    networks:
      - triplef.io

        # Headless-chromium MCP sidecar exposing browser automation tools to the
  # harness models. Internal-only: the server reaches it at
  # http://playwright-mcp:8931/mcp, no host port is published.
  playwright-mcp:
    container_name: playwright-mcp
    image: mcr.microsoft.com/playwright/mcp
    init: true
    restart: on-failure
    # Chromium wants a larger /dev/shm than Docker's default 64MB.
    shm_size: 1gb
    entrypoint: ["node", "/app/cli.js"]
    # allowed-hosts entries must match the Host header verbatim — port included.
    command: ["--headless", "--browser", "chromium", "--isolated", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "playwright-mcp:8931,localhost:8931, dashboard:5173", "--caps", "testing"]
    # Loopback-only publish so host-side MCP clients (pi via pi-mcp-extension)
    # can reach the sidecar at http://localhost:8931/mcp. Not exposed to the LAN.
    ports:
      - "127.0.0.1:8931:8931"
    networks:
      - triplef.io

