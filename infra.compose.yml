services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: on-failure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: triplef
      POSTGRES_PASSWORD: triplef
      POSTGRES_DB: triplef
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - triplef

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: on-failure
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - triplef

  keydb:
    image: eqalpha/keydb
    container_name: keydb
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - keydb_data:/data
      - ./apps/server/keydb.conf:/usr/local/etc/keydb/keydb.conf
    command: keydb-server /usr/local/etc/keydb/keydb.conf
    networks:
      - triplef

  # Qdrant vector store for the dual-tier semantic memory feature (Ticket 6).
  # REST 6333 only — the server talks to it via @qdrant/js-client-rest at
  # http://qdrant:6333 (gRPC 6334 deliberately not published; REST is the
  # chosen protocol for the JS client). Loopback-only publish matches the
  # playwright-mcp precedent — not exposed to the LAN.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: on-failure
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      # Auth OFF for local dev (internal network only). For shared/prod
      # deployments set QDRANT__SERVICE__API_KEY (+ READ_ONLY_API_KEY for
      # query-only consumers) here and mirror it into the server env — never
      # commit keys.
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget/nc — use bash /dev/tcp to issue a
      # real GET /healthz and assert a 200 response.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - triplef

