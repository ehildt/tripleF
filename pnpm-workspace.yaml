packages:
  - '.'
  - 'packages/*'
  - 'apps/*'

# pnpm 11 defaults verifyDepsBeforeRun to `install`, which runs a workspace-wide
# `pnpm install` before every script. That breaks the publish flow: the apps
# reference a not-yet-published @triplef/agent version, so the auto-install
# fails before the build can run. The Docker targets already set
# pnpm_config_verify_deps_before_run=false; mirror that here.
verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  fastify-socket.io: true
  msgpackr-extract: true
  prisma: true
  vue-demi: true

minimumReleaseAge: 0
# minimumReleaseAgeExclude:
