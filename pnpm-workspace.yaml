packages:
  - '.'
  - 'packages/*'
  - 'apps/*'

# pnpm 11 defaults verifyDepsBeforeRun to `install`, which runs a workspace-wide
# `pnpm install` before every script. That breaks the publish flow: the apps
# reference a not-yet-published @triplef/agent version, so the auto-install
# fails before the build can run. The Docker targets already set
# pnpm_config_verify_deps_before_run=false; mirror that here.
verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  fastify-socket.io: true
  msgpackr-extract: true
  prisma: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@triplef/agent@0.1.28 || 1.0.1'
  - '@triplef/bullmq-logger@1.2.5'
  - '@triplef/helpers@1.5.6'
  - dompurify@3.4.15
  - eslint-plugin-vue@10.11.0
  - '@types/node@26.5.0'
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
  - unplugin-swc@1.6.0
  - '@ai-sdk/gateway@4.0.76'
  - '@ai-sdk/mcp@2.0.46'
  - '@ai-sdk/provider-utils@5.0.37'
  - '@ai-sdk/provider@4.0.11'
  - '@lucide/icons@1.43.0'
  - '@lucide/vue@1.43.0'
  - ai@7.0.94
  - jszip@3.10.2
