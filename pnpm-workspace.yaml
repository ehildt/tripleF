packages:
  - '.'
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  fastify-socket.io: true
  msgpackr-extract: true
  prisma: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@intlify/core-base@11.4.9'
  - '@intlify/devtools-types@11.4.9'
  - '@intlify/message-compiler@11.4.9'
  - '@intlify/shared@11.4.9'
  - '@tanstack/query-core@5.102.1 || 5.102.2 || 5.102.3'
  - '@tanstack/vue-query@5.102.1 || 5.102.2 || 5.102.3'
  - '@triplef/*'
  - vue-i18n@11.4.9
  - npm-check-updates@23.1.0
  - '@lucide/vue@1.34.0'
  - '@ai-sdk/gateway@4.0.64'
  - '@ai-sdk/mcp@2.0.37'
  - '@ai-sdk/provider-utils@5.0.30'
  - '@ai-sdk/provider@4.0.8'
  - '@nestjs/common@11.2.2 || 11.2.3'
  - '@nestjs/core@11.2.2 || 11.2.3'
  - '@nestjs/microservices@11.2.2 || 11.2.3'
  - '@nestjs/platform-fastify@11.2.2 || 11.2.3'
  - '@nestjs/testing@11.2.2 || 11.2.3'
  - '@types/node@26.3.0'
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - ai@7.0.79
  - bullmq@6.2.1
  - eslint@10.9.1
  - typescript-eslint@8.68.0
  - '@prisma/config@7.10.0'
  - '@prisma/debug@7.10.0'
  - '@prisma/engines@7.10.0'
  - '@prisma/fetch-engine@7.10.0'
  - '@prisma/get-platform@7.10.0'
  - prisma@7.10.0
