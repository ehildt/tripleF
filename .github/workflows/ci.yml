name: CI

# Shared lint / build / test pipeline used by both the non-release and release
# workflows. Parameterized so each caller only supplies what differs:
#   - `production`: use production builds (server/memory `build:prod`) vs dev builds
#   - `upload-coverage`: upload v8 coverage to Codecov (push only)
#   - `upload-artifacts`: publish helpers/config-factory/core-logger/bullmq/bullmq-logger dist for the release jobs
#
# Single pnpm workspace (pnpm-workspace.yaml: `packages/*` + `apps/*` + root):
# one root `pnpm install --frozen-lockfile` installs everything, then each
# package is verified with `pnpm --filter <pkg> run <script>`.
#
# The package list lives in the matrix below — add a new package/app by adding
# one entry (no new steps required).
on:
  workflow_call:
    inputs:
      production:
        description: Use production builds (server/memory `build:prod`).
        type: boolean
        required: false
        default: false
      upload-coverage:
        description: Upload coverage to Codecov (push only).
        type: boolean
        required: false
        default: false
      upload-artifacts:
        description: Upload dist artifacts for the release jobs.
        type: boolean
        required: false
        default: false

env:
  HUSKY: 0

jobs:
  build-test:
    name: Build & Test (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: server
            filter: '@triplef/server'
            build: build
            prod-build: build:prod
            coverage-flag: server
            artifact: ''
            artifact-path: ''
          - name: dashboard
            filter: '@triplef/dashboard'
            build: build
            prod-build: ''
            coverage-flag: dashboard
            artifact: ''
            artifact-path: ''
          - name: memory
            filter: '@triplef/memory'
            build: build
            prod-build: build:prod
            coverage-flag: memory
            artifact: ''
            artifact-path: ''
          - name: helpers
            filter: '@triplef/helpers'
            build: build
            prod-build: ''
            coverage-flag: helpers
            artifact: helpers-dist
            artifact-path: packages/helpers/dist/
          - name: config-factory
            filter: '@triplef/config-factory'
            build: build
            prod-build: ''
            coverage-flag: config-factory
            artifact: config-factory-dist
            artifact-path: packages/config-factory/dist/
          - name: core-logger
            filter: '@triplef/core-logger'
            build: build
            prod-build: ''
            coverage-flag: core-logger
            artifact: core-logger-dist
            artifact-path: packages/core-logger/dist/
          - name: bullmq
            filter: '@triplef/bullmq'
            build: build
            prod-build: ''
            coverage-flag: bullmq
            artifact: bullmq-dist
            artifact-path: packages/bullmq/dist/
          - name: bullmq-logger
            filter: '@triplef/bullmq-logger'
            build: build
            prod-build: ''
            coverage-flag: bullmq-logger
            artifact: bullmq-logger-dist
            artifact-path: packages/bullmq-logger/dist/
          - name: socketio
            filter: '@triplef/socketio'
            build: build
            prod-build: ''
            coverage-flag: socketio
            artifact: socketio-dist
            artifact-path: packages/socketio/dist/
          - name: ai-sdk
            filter: '@triplef/ai-sdk'
            build: build
            prod-build: ''
            coverage-flag: ai-sdk
            artifact: ai-sdk-dist
            artifact-path: packages/ai-sdk/dist/
          - name: agent
            filter: '@triplef/agent'
            build: build
            prod-build: ''
            coverage-flag: agent
            artifact: agent-dist
            artifact-path: packages/agent/dist/

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm --filter ${{ matrix.package.filter }} run lint
          pnpm --filter ${{ matrix.package.filter }} run depcruise
          pnpm --filter ${{ matrix.package.filter }} run lint:unused

      - name: Build
        if: ${{ !inputs.production || matrix.package.prod-build == '' }}
        run: pnpm --filter ${{ matrix.package.filter }} run ${{ matrix.package.build }}

      - name: Build (production)
        if: ${{ inputs.production && matrix.package.prod-build != '' }}
        run: pnpm --filter ${{ matrix.package.filter }} run ${{ matrix.package.prod-build }}

      - name: Test
        run: pnpm --filter ${{ matrix.package.filter }} run test:cov

      - name: Upload Coverage
        if: ${{ inputs.upload-coverage && github.event_name == 'push' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: ${{ matrix.package.coverage-flag }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Artifact
        if: ${{ inputs.upload-artifacts && github.event_name == 'push' && matrix.package.artifact != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package.artifact }}
          path: ${{ matrix.package.artifact-path }}
