name: CI

# Shared lint / build / test pipeline used by both the non-release and release
# workflows. Parameterized so each caller only supplies what differs:
#   - `production`: use production builds (server `build:prod`) vs dev builds
#   - `upload-coverage`: upload v8 coverage to Codecov (push only)
#   - `upload-artifacts`: publish server/dashboard/helpers/config-factory dist for the release jobs
#
# Single pnpm workspace (pnpm-workspace.yaml: `packages/*` + `apps/*` + root):
# one root `pnpm install --frozen-lockfile` installs everything, then each
# package is verified with `pnpm --filter <pkg> run <script>`.
on:
  workflow_call:
    inputs:
      production:
        description: Use production builds (server `build:prod`).
        type: boolean
        required: false
        default: false
      upload-coverage:
        description: Upload coverage to Codecov (push only).
        type: boolean
        required: false
        default: false
      upload-artifacts:
        description: Upload dist artifacts for the release jobs.
        type: boolean
        required: false
        default: false

env:
  HUSKY: 0

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint — Server
        run: |
          pnpm --filter @triplef/server run lint
          pnpm --filter @triplef/server run depcruise
          pnpm --filter @triplef/server run lint:unused

      - name: Lint — Dashboard
        run: |
          pnpm --filter @triplef/dashboard run lint
          pnpm --filter @triplef/dashboard run depcruise
          pnpm --filter @triplef/dashboard run lint:unused

      - name: Lint — Helpers
        run: |
          pnpm --filter @triplef/helpers run lint
          pnpm --filter @triplef/helpers run depcruise
          pnpm --filter @triplef/helpers run lint:unused

      - name: Lint — Config-Factory
        run: |
          pnpm --filter @triplef/config-factory run lint
          pnpm --filter @triplef/config-factory run depcruise
          pnpm --filter @triplef/config-factory run lint:unused

      - name: Build — Server
        if: ${{ !inputs.production }}
        run: pnpm --filter @triplef/server run build

      - name: Build — Server (production)
        if: inputs.production
        run: pnpm --filter @triplef/server run build:prod

      - name: Build — Dashboard
        run: pnpm --filter @triplef/dashboard run build

      - name: Build — Helpers
        run: pnpm --filter @triplef/helpers run build

      - name: Build — Config-Factory
        run: pnpm --filter @triplef/config-factory run build

      - name: Test — Server
        run: pnpm --filter @triplef/server run test:cov

      - name: Test — Dashboard
        run: pnpm --filter @triplef/dashboard run test:cov

      - name: Test — Helpers
        run: pnpm --filter @triplef/helpers run test:cov

      - name: Test — Config-Factory
        run: pnpm --filter @triplef/config-factory run test:cov

      - name: Upload Coverage — Server
        if: ${{ inputs.upload-coverage && github.event_name == 'push' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: server
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage — Dashboard
        if: ${{ inputs.upload-coverage && github.event_name == 'push' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: dashboard
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage — Helpers
        if: ${{ inputs.upload-coverage && github.event_name == 'push' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: helpers
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage — Config-Factory
        if: ${{ inputs.upload-coverage && github.event_name == 'push' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: config-factory
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Artifact — Server
        if: ${{ inputs.upload-artifacts && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: server-dist
          path: apps/server/dist/

      - name: Build Artifact — Dashboard
        if: ${{ inputs.upload-artifacts && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: apps/dashboard/dist/

      - name: Build Artifact — Helpers
        if: ${{ inputs.upload-artifacts && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: helpers-dist
          path: packages/helpers/dist/

      - name: Build Artifact — Config-Factory
        if: ${{ inputs.upload-artifacts && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: config-factory-dist
          path: packages/config-factory/dist/
