name: RELEASE_CI

# Trusted publishing (OIDC) note for @triplef/helpers and @triplef/config-factory:
#   npmjs.com → package settings → Trusted Publisher → GitHub Actions
#     Organization or user: ehildt
#     Repository:           tripleF
#     Workflow filename:    release.ci.yml
#     Environment:          (blank)
# The publish steps must run in THIS workflow file (not a workflow_call child),
# and requires `permissions.id-token: write` so GitHub mints the OIDC token
# that pnpm exchanges for a short-lived npm publish token. No NPM_TOKEN is
# used — a static token would bypass the OIDC path entirely.
# Each published package needs its own Trusted Publisher entry (same workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC trusted publishing for @triplef/helpers

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Lint, build and test are shared with the non-release pipeline via ci.yml.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      production: true
      upload-coverage: true
      upload-artifacts: true
    secrets: inherit

  repo-update:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm -r install --frozen-lockfile

      - name: Changeset
        run: pnpm changeset version

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "VERSION BUMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Server dist
        uses: actions/download-artifact@v8
        with:
          name: server-dist
          path: apps/server/dist/

      - name: Download Dashboard dist
        uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: apps/dashboard/dist/

      - name: Download Helpers dist
        uses: actions/download-artifact@v8
        with:
          name: helpers-dist
          path: packages/helpers/dist/

      - name: Download Config-Factory dist
        uses: actions/download-artifact@v8
        with:
          name: config-factory-dist
          path: packages/config-factory/dist/

      - name: Depbadge — Server
        run: cd apps/server && npx @ehildt/depbadge

      - name: Depbadge — Dashboard
        run: cd apps/dashboard && npx @ehildt/depbadge

      - name: Depbadge — Helpers
        run: cd packages/helpers && npx @ehildt/depbadge

      - name: Depbadge — Config-Factory
        run: cd packages/config-factory && npx @ehildt/depbadge

      - name: Commit badge bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "BADGE BUMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Version bump for @triplef/helpers + @triplef/config-factory is handled by
  # the root (repo-update) changeset flow — their changesets live at the root.
  wiki:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync wiki
        run: |
          test -d .wiki || { echo "::error::.wiki folder missing"; exit 1; }
          rsync -a --delete --exclude '.git/' .wiki/ wiki/

      - name: Commit wiki
        working-directory: wiki
        run: |
          git config user.name "wiki[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "WIKI UPDATE"
          git push

  publish-helpers:
    if: github.event_name == 'push'
    needs: [repo-update, wiki]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ensure we can see the latest commits

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: helpers-dist
          path: packages/helpers/dist/

      - name: Publish
        working-directory: packages/helpers
        run: |
          current="$(node -p "require('./package.json').version")"
          published="$(npm view @triplef/helpers version 2>/dev/null || true)"
          if [ -n "$published" ] && [ "$current" = "$published" ]; then
            echo "Version $current is already published — skipping publish."
          else:
            # Trusted publishing: pnpm exchanges the GitHub OIDC token
            # (id-token: write) for a short-lived npm token automatically.
            pnpm publish --no-git-checks --provenance
          fi

  publish-config-factory:
    if: github.event_name == 'push'
    needs: [repo-update, wiki]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ensure we can see the latest commits

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: config-factory-dist
          path: packages/config-factory/dist/

      - name: Publish
        working-directory: packages/config-factory
        run: |
          current="$(node -p "require('./package.json').version")"
          published="$(npm view @triplef/config-factory version 2>/dev/null || true)"
          if [ -n "$published" ] && [ "$current" = "$published" ]; then
            echo "Version $current is already published — skipping publish."
          else
            # Trusted publishing: pnpm exchanges the GitHub OIDC token
            # (id-token: write) for a short-lived npm token automatically.
            pnpm publish --no-git-checks --provenance
          fi
